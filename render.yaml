# Blueprint de Render. Un solo servicio corre la API (interna, :4000) y la web
# (puerto público): un único arranque en frío en el plan gratuito.
# Para producción con tráfico real conviene separarlos y usar planes pagos
# (la base gratuita de Render expira a los 30 días).
databases:
  - name: rincon-db
    plan: free
    region: virginia
    postgresMajorVersion: "16"

services:
  - type: web
    name: rincon-del-busca
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /robots.txt
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: rincon-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: WEB_ORIGIN
        value: https://rincon-del-busca.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://rincon-del-busca.onrender.com
      - key: REVALIDATE_SECRET
        generateValue: true
      - key: OWNER_EMAIL
        value: dueno@rincondelbusca.cl
      - key: BUSINESS_TZ
        value: America/Argentina/Buenos_Aires
      # OWNER_PASSWORD y DEMO_STAFF_PASSWORD se cargan desde el panel de Render
      # (nunca en el repo). Sin OWNER_PASSWORD el seed se omite.
