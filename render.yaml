# Blueprint de Render. Un solo servicio corre la API (interna, :4000) y la web
# (puerto público): un único arranque en frío en el plan gratuito.
# Para producción con tráfico real conviene separarlos y usar planes pagos
# (la base gratuita de Render expira a los 30 días).
databases:
  - name: rincon-db
    plan: free
    databaseName: rincon
    user: rincon

services:
  - type: web
    name: rincon-del-busca
    runtime: node
    plan: free
    buildCommand: npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /robots.txt
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rincon-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: WEB_ORIGIN
        sync: false # URL pública, ej. https://rincon-del-busca.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        sync: false # misma URL pública
      - key: REVALIDATE_SECRET
        generateValue: true
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: DEMO_STAFF_PASSWORD
        sync: false # opcional: crea el usuario Empleado de demostración
      - key: BUSINESS_TZ
        value: America/Santiago
